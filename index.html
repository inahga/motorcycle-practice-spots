<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motorcycle Practice Spots</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏍️</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = L.map('map').setView([45.5, -122.6], 9);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &middot; <a href="https://www.openstreetmap.org/fixthemap">Report a map issue</a> &middot; <a href="https://github.com/inahga">Contact</a>'
    }).addTo(map);

    fetch('spots.geojson')
      .then(r => r.json())
      .then(data => {
        const layer = L.geoJSON(data, {
          onEachFeature: (feature, marker) => {
            const p = feature.properties ?? {};
            const [lon, lat] = feature.geometry.coordinates;
            const gmaps = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
            marker.bindPopup(
              `<b>${p.name ?? 'Unnamed spot'}</b>`
              + (p.address ? `<br><i><a href="${gmaps(p.address)}" target="_blank" rel="noopener">${p.address}</a></i>` : '')
              + `<br><small><a href="${gmaps(`${lat}, ${lon}`)}" target="_blank" rel="noopener">${lat.toFixed(5)}, ${lon.toFixed(5)}</a></small>`
              + (p.notes ? `<br>${p.notes}` : '')
            );
          }
        }).addTo(map);

        if (data.features?.length) {
          map.fitBounds(layer.getBounds(), { padding: [30, 30], maxZoom: 13 });
        }
      })
      .catch(err => console.error('Failed to load spots.geojson:', err));
  </script>
</body>
</html>
